# ============================================================
# Moteur de recherche DAAR - 3 conteneurs : db, back, front
# Lancer :   docker compose up -d
# Arrêter :  docker compose down        (garde les données)
# DANGER :   docker compose down -v     (supprime aussi les volumes, donc la base)
# ============================================================

services:

  # ---------- 1. BASE DE DONNÉES ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Les données de PostgreSQL : survivent à l'arrêt des conteneurs
      - pgdata:/var/lib/postgresql/data
      # Scripts SQL exécutés automatiquement au PREMIER démarrage (volume vide)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "Prêt" = PostgreSQL accepte les connexions
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interne]
    # Pas de "ports" : la base n'est joignable que par le back

  # ---------- 2. API ----------
  backend:
    build: ./backend
    # image: daar-backend:latest
    restart: unless-stopped
    environment:
      # "db" = nom du service ci-dessus, résolu par le réseau Docker
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BOOKS_DIR: /data/books
    volumes:
      # Textes des livres : data/books/
      # visible dans le conteneur sous /data/books
      # - books:/data/books
      - ./data/books:/data/books
    depends_on:
      db:
        condition: service_healthy   # attend que la base soit prête
    networks: [interne]
    # Pas de "ports" : l'API n'est joignable que par le front

  # ---------- 3. CLIENT WEB ----------
  frontend:
    build: ./frontend
    # image: daar-front:latest
    restart: unless-stopped
    ports:
      # Seul port ouvert vers l'extérieur. Si 80 est déjà pris : "8080:80"
      - "80:80"
    depends_on:
      - backend
    networks: [interne]

volumes:
  pgdata:
    # Volume persistant pour la base de données
    driver: local
  books:
    # Volume pour les textes des livres
    driver: local

networks:
  interne:
    driver: bridge