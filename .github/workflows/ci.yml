name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ------------------------------------------------------------
  # 1. Lint + tests unitaires du backend
  # ------------------------------------------------------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r backend/requirements.txt ruff pytest

      # Seulement les erreurs graves (syntaxe, noms non définis), pas le style
      - name: Lint
        run: ruff check backend --select E9,F63,F7,F82

      # code 5 = aucun test trouvé : toléré tant qu'il n'y a pas de tests
      - name: Tests unitaires
        working-directory: backend
        run: python -m pytest || [ $? -eq 5 ]

  # ------------------------------------------------------------
  # 2. Build de toute la stack + smoke test
  # ------------------------------------------------------------
  build-and-smoke:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer le .env
        run: cp env.example .env

      - name: Build + démarrage (attend les healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test (front -> nginx -> API)
        run: |
          curl -fsS http://localhost/ > /dev/null
          curl -fsS http://localhost/api/health

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Nettoyage
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------
  # 3. Publication des images sur GHCR (uniquement sur main)
  # ------------------------------------------------------------
  publish:
    needs: build-and-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # GHCR exige des noms en minuscules
      - name: Nom d'image en minuscules
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max