server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # --- PUBLIC : page de connexion et ses ressources (seules pages accessibles sans compte) ---
    location ~ ^/(login\.html|login\.js|login\.css|style\.css)$ {
        try_files $uri =404;
    }

    # --- API : le backend vérifie lui-même la session (401 JSON si absente) ---
    location /api/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Sous-requête interne : « cette session est-elle valide ? » (jamais appelable depuis l'extérieur) ---
    location = /_auth {
        internal;
        proxy_pass http://backend:3000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Tout le reste du site : réservé aux utilisateurs connectés ---
    location / {
        auth_request /_auth;
        error_page 401 = @vers_login;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        try_files $uri $uri/ /index.html;
    }

    location @vers_login {
        return 302 /login.html;
    }
}
